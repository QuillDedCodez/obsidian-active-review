name: Release

# Builds the plugin from the tagged source, attests the release assets, and
# replaces the release's assets with those exact bytes. Run this from the
# published release (or dispatch it for an existing tag) so the download and
# the provenance attestation always describe the same build.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild (must equal manifest.json version)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "No release tag supplied." >&2
            exit 1
          fi
          echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Verify and build
        run: npm run build -- --no-sync

      - name: Check that the tag matches the manifest
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match manifest.json version $VERSION." >&2
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Upload attested assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release upload "$TAG" main.js manifest.json styles.css --clobber
          gh release edit "$TAG" --title "Active Review $TAG"
